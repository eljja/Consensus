<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="8" />

  <!-- Grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(255,255,255,0.06)" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.06)" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="80" y1="352" x2="432" y2="352" stroke="rgba(255,255,255,0.06)" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Stock Trend Line (Rising) -->
  <path d="M 80 360 L 160 310 L 240 340 L 340 210 L 420 120" fill="none" stroke="url(#line)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Target Consensus Bullseye Ring -->
  <circle cx="420" cy="120" r="48" fill="none" stroke="url(#targetGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="420" cy="120" r="24" fill="url(#targetGrad)" filter="url(#glow)" />
  <circle cx="420" cy="120" r="8" fill="#ffffff" />
</svg>
