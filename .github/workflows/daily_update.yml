name: Weekly Consensus Data Update

on:
  schedule:
    # Run weekly at 16:00 UTC on Friday (01:00 KST Saturday) after US & KR market close for the week
    - cron: '0 16 * * 5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch & process consensus data
        run: |
          python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || (git commit -m "auto: weekly consensus data update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
